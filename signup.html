<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiteRush - Create Account</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="login-card">
    <div class="logo">
      <div class="logo-icon">🛵</div>
      <h1>BiteRush</h1>
      <p>Create your account</p>
    </div>

    <form id="signupForm">
      <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Rahul Sharma" required>
      </div>

      <div class="field">
        <label for="phone">Mobile Number</label>
        <input type="tel" id="phone" placeholder="98765 43210" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="rahul@example.com" required>
        <p class="hint">Offers and discounts will be sent to this email</p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" required>
      </div>

      <button type="submit" class="login-btn">Create Account</button>
    </form>

    <div class="msg" id="successMsg">
      ✅ Account created successfully! <a href="index.html" class="inline-link">click here to login</a>
    </div>

    <div class="msg error" id="errorMsg">⚠️ Passwords do not match</div>

    <div class="divider">or</div>

    <div class="signup-link">
      Already have an account? <a href="index.html">Login here</a>
    </div>
  </div>
     <script src="api-config.js"></script>
     <script src="signup-script.js"></script>
</body>
</html>
