<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BiteRush - Live Tracking</title>
<link rel="stylesheet" href="track-style.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <div class="logo-icon">🛵</div>
      <div>
        <h1>Track Your Order</h1>
        <p class="sub">Order #QB1042</p>
      </div>
    </div>
    <a href="menu.html" class="view-app-btn">← View Menu</a>
  </header>

  <main class="track-wrap">

    <!-- Status steps -->
    <div class="status-steps" id="statusSteps">
      <div class="step" data-step="0">
        <div class="step-dot">✓</div>
        <span>Order Placed</span>
      </div>
      <div class="step" data-step="1">
        <div class="step-dot">✓</div>
        <span>Preparing</span>
      </div>
      <div class="step" data-step="2">
        <div class="step-dot">✓</div>
        <span>Out for Delivery</span>
      </div>
      <div class="step" data-step="3">
        <div class="step-dot">✓</div>
        <span>Delivered</span>
      </div>
    </div>

    <!-- Map -->
    <div class="map-card">
      <div class="eta-badge" id="etaBadge">ETA: -- min</div>

      <svg id="mapSvg" viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg">
        <!-- background "map" -->
        <rect x="0" y="0" width="500" height="320" fill="#1A2921" />
        <!-- some faint grid lines to look map-like -->
        <g stroke="#22352B" stroke-width="1">
          <line x1="0" y1="60" x2="500" y2="60" />
          <line x1="0" y1="140" x2="500" y2="140" />
          <line x1="0" y1="220" x2="500" y2="220" />
          <line x1="0" y1="280" x2="500" y2="280" />
          <line x1="90" y1="0" x2="90" y2="320" />
          <line x1="220" y1="0" x2="220" y2="320" />
          <line x1="350" y1="0" x2="350" y2="320" />
          <line x1="440" y1="0" x2="440" y2="320" />
        </g>

        <!-- delivery route -->
        <path id="routePath" d="M 60 260 C 150 260, 120 100, 220 100 S 380 60, 440 60"
              fill="none" stroke="#FFC93C" stroke-width="4" stroke-dasharray="8 6" />

        <!-- restaurant marker -->
        <g transform="translate(60,260)">
          <circle r="12" fill="#4CAF7D" />
          <text x="0" y="5" text-anchor="middle" font-size="14">🍽️</text>
        </g>
        <text x="60" y="290" text-anchor="middle" fill="#9BA79E" font-size="11">Restaurant</text>

        <!-- home marker -->
        <g transform="translate(440,60)">
          <circle r="12" fill="#FF6B5B" />
          <text x="0" y="5" text-anchor="middle" font-size="14">🏠</text>
        </g>
        <text x="440" y="42" text-anchor="middle" fill="#9BA79E" font-size="11">Your Home</text>

        <!-- moving delivery marker -->
        <g id="deliveryMarker">
          <circle r="14" fill="#FFC93C" />
          <text x="0" y="5" text-anchor="middle" font-size="16">🛵</text>
        </g>
      </svg>
    </div>

    <div class="delivery-info" id="deliveryInfo">
      <div class="info-emoji">🛵</div>
      <div>
        <div class="info-name">Ramesh Kumar</div>
        <div class="info-role">Your delivery partner • ⭐ 4.8</div>
      </div>
    </div>

  </main>

  <script src="track-script.js"></script>
     <script src="api-config.js"></script>
</body>
</html>
